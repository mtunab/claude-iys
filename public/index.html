<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="İYS Takip" />
    <title>YTÜ İYS Takip Paneli</title>
    <script>
      (function () {
        var saved = localStorage.getItem('iys-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f4f1ea'/><text x='50' y='72' font-family='Georgia,serif' font-size='72' font-weight='700' fill='%23c8442c' text-anchor='middle'>İ</text></svg>"
    />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-logo">İ</span>
          <div>
            <div class="brand-title">İYS Takip</div>
            <div class="brand-sub">YTÜ Yeterlik Sınavı</div>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-item" data-view="dashboard">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="9" width="3" height="5.5" rx="0.5"/><rect x="6.5" y="5.5" width="3" height="9" rx="0.5"/><rect x="11.5" y="1.5" width="3" height="13" rx="0.5"/></svg>
            </span><span class="nav-label">Dashboard</span>
          </button>
          <button class="nav-item" data-view="grammar">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 3c1.8-1 4-1 5.5.3V13c-1.5-1.3-3.7-1.3-5.5-.3V3Z"/><path d="M14 3c-1.8-1-4-1-5.5.3V13c1.5-1.3 3.7-1.3 5.5-.3V3Z"/></svg>
            </span><span class="nav-label">Grammar</span>
          </button>
          <button class="nav-item" data-view="questionTypes">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5"/><path d="M6 6.2c0-1.1.9-2 2-2s2 .7 2 1.7c0 1.3-2 1.2-2 2.9" stroke-linecap="round"/><circle cx="8" cy="11.4" r="0.6" fill="currentColor" stroke="none"/></svg>
            </span><span class="nav-label">Soru Tipleri</span>
          </button>
          <button class="nav-item" data-view="tasks">
            <span class="nav-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 8.5 5 11l4-6"/><line x1="9" y1="4" x2="14" y2="4"/><line x1="9" y1="8" x2="14" y2="8"/><line x1="9" y1="12" x2="14" y2="12"/></svg>
            </span><span class="nav-label">Görevler</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <div id="streakBadge" class="streak"><b id="streakCount">0</b> gün seri</div>
          <button id="themeToggle" class="theme-toggle" title="Tema değiştir" aria-label="Tema değiştir">
            <svg class="theme-icon-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4 3.3 3.3"/></svg>
            <svg class="theme-icon-moon" viewBox="0 0 16 16"><path d="M13.5 9.5A5.8 5.8 0 0 1 6.5 2.5a5.8 5.8 0 1 0 7 7Z"/></svg>
          </button>
        </div>
      </aside>

      <main class="content">
        <div id="view"></div>
      </main>
    </div>

    <!-- Konu penceresi (modal) -->
    <div id="modalRoot"></div>
    <!-- Bildirim -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
